    </clipPath>
    <clipPath id="valance">
      <path d="M8,50 h84 v6 q-10.5,8 -21,0 q-10.5,8 -21,0 q-10.5,8 -21,0 q-10.5,8 -21,0 Z"/>
    </clipPath>
  </defs>
  <g transform="translate(21,19.02) scale(0.66)">
    <rect x="15" y="58" width="5" height="30" rx="2.5" fill="#6B4A2E"/>
    <rect x="80" y="58" width="5" height="30" rx="2.5" fill="#6B4A2E"/>
    <g clip-path="url(#roof)">
      <rect x="8" y="14" width="21" height="40" fill="#3D6E9C"/>
      <rect x="29" y="14" width="21" height="40" fill="#2F8F7F"/>
      <rect x="50" y="14" width="21" height="40" fill="#E9A13B"/>
      <rect x="71" y="14" width="21" height="40" fill="#D9534F"/>
    </g>
    <g clip-path="url(#valance)">
