         thing a circle mask took. -->
    <circle cx="50" cy="78" r="14" fill="#2F2A26" stroke="#FFF8F4" stroke-width="3"/>
    <path d="M42,71 H58 V75.5 H52.25 V85.5 H47.75 V75.5 H42 Z" fill="#FFF8F4"/>
