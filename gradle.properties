org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is off: AGP 9's navigation-resources task fails to serialise.
# Worth retrying once the AGP/KMP structure is sorted out.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 refuses 'com.android.application' alongside the Kotlin Multiplatform plugin
# unless the built-in Kotlin support and new DSL are disabled. The alternative is
# splitting into a KMP library plus a separate Android app module, which is not
# worth it at this size.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
